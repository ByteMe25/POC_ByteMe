<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - POC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-page">
    <div class="login-box">
        <h1 id="title-login">Second Brain</h1>
        <h2>Login - POC</h2>
        <form class="login-form">
            <div class="login-input-group">
                <input type="text" id="emailInput" placeholder="Email" required>
            </div>

            <div class="login-input-group">
                <input type="password" id="passwordInput" placeholder="Password" required>
            </div>
            
            <button type="button" class="login-btn" onclick="loginUtente()">Accedi</button>
            <a href="Register.html" id="rimando-registrazione">Registrati qui</a> <br>
            <a href="index.html" class="torna-editor">Torna all'Editor</a>
        </form>
    </div>
</div>
<script src="login_register.js"></script>
</body>
</html>
